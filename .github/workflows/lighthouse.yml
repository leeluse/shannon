name: Lighthouse CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --cwd client --frozen-lockfile

      - name: Build app
        run: bun run --cwd client build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun --config=.github/lighthouse/lighthouserc.json
