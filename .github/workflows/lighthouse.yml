name: Lighthouse CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: bun install --cwd client --frozen-lockfile

      - name: Build app
        run: bun run --cwd client build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun --config=.github/lighthouse/lighthouserc.json
