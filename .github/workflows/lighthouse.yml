name: Lighthouse CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --cwd client --frozen-lockfile

      - name: Build app
        run: bun run --cwd client build

      - name: Run Lighthouse CI
        working-directory: client
        run: npx @lhci/cli@0.15.x autorun --config=lighthouserc.json

      - name: Debug Lighthouse output
        run: find . -name "manifest.json" -o -name "*.report.json" -o -name "links.json"

      - name: Post or Update PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const manifestPath = path.join(process.env.GITHUB_WORKSPACE, 'client', '.lighthouseci', 'manifest.json');
            const linksPath = path.join(process.env.GITHUB_WORKSPACE, 'client', '.lighthouseci', 'links.json');
            
            if (!fs.existsSync(manifestPath)) {
              core.setFailed('Lighthouse manifest not found at: ' + manifestPath);
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.length === 0) {
              core.setFailed('Lighthouse manifest is empty.');
              return;
            }

            const run = manifest[0];
            const reportFilename = path.basename(run.jsonPath);
            const reportPath = path.join(path.dirname(manifestPath), reportFilename);

            if (!fs.existsSync(reportPath)) {
              core.setFailed('Lighthouse report JSON not found at: ' + reportPath);
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const scores = {
              performance: Math.round(report.categories.performance.score * 100),
              accessibility: Math.round(report.categories.accessibility.score * 100),
              bestPractices: Math.round(report.categories['best-practices'].score * 100),
              seo: Math.round(report.categories.seo.score * 100)
            };

            let reportUrl = '';
            if (fs.existsSync(linksPath)) {
              const links = JSON.parse(fs.readFileSync(linksPath, 'utf8'));
              // Get the temporary-public-storage report URL
              reportUrl = links['http://localhost:3000/'] || Object.values(links)[0] || '';
            }

            const getEmoji = (score) => {
              if (score >= 90) return '🟢';
              if (score >= 50) return '🟡';
              return '🔴';
            };

            const getStatus = (score) => {
              if (score >= 90) return 'Good';
              if (score >= 50) return 'Needs Improvement';
              return 'Poor';
            };

            const getProgressBar = (score) => {
              const totalBlocks = 10;
              const filledBlocks = Math.round(score / 10);
              const emptyBlocks = totalBlocks - filledBlocks;
              return '█'.repeat(filledBlocks) + '░'.repeat(emptyBlocks);
            };

            const marker = '<!-- lighthouse-ci-report -->';
            const commentBody = [
              marker,
              '## 📊 Lighthouse 성능 리포트',
              '_새 커밋이 푸시될 때마다 성능이 자동으로 재측정되어 업데이트됩니다._',
              '',
              '| 카테고리 | 점수 | 진행바 | 상태 |',
              '| --- | --- | --- | --- |',
              `| ⚡ **Performance** | **${scores.performance} / 100** | \`${getProgressBar(scores.performance)}\` | ${getEmoji(scores.performance)} ${getStatus(scores.performance)} |`,
              `| ♿ **Accessibility** | **${scores.accessibility} / 100** | \`${getProgressBar(scores.accessibility)}\` | ${getEmoji(scores.accessibility)} ${getStatus(scores.accessibility)} |`,
              `| 🛡️ **Best Practices** | **${scores.bestPractices} / 100** | \`${getProgressBar(scores.bestPractices)}\` | ${getEmoji(scores.bestPractices)} ${getStatus(scores.bestPractices)} |`,
              `| 🔍 **SEO** | **${scores.seo} / 100** | \`${getProgressBar(scores.seo)}\` | ${getEmoji(scores.seo)} ${getStatus(scores.seo)} |`,
              '',
              reportUrl ? `🔗 **[상세 리포트 보기](${reportUrl})**` : '⚠️ *상세 리포트 링크를 생성할 수 없습니다.*',
              '',
              `*최종 측정 시간: ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })}*`
            ].join('\n');

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });

            const existingComment = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              console.log('Successfully updated the existing Lighthouse report comment.');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: commentBody,
              });
              console.log('Successfully created a new Lighthouse report comment.');
            }

