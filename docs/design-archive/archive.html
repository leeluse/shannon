<!DOCTYPE html>
<html lang="ko">
<!-- ============================================================
  archive.html — 컴포넌트 아카이브 앱
  이 파일은 수정할 필요 없음. 컴포넌트 추가/관리는 components.js에서.
============================================================ -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Components Archive</title>
  <link rel="stylesheet" href="archive.css" />
</head>
<body>
  <div class="app">
    <!-- 좌측: 컴포넌트 목록 -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <strong>Components</strong>
        <span class="count" id="count"></span>
      </div>
      <input class="search" id="search" type="text" placeholder="검색…" />
      <nav class="list" id="list"></nav>
    </aside>

    <!-- 중앙: 미리보기 캔버스 -->
    <main class="stage">
      <div class="stage-head">
        <h1 id="comp-name">—</h1>
        <span class="badge" id="comp-status"></span>
        <span class="hint">Alt 홀드 + 호버 = 치수 측정</span>
      </div>
      <div class="canvas" id="canvas"></div>
    </main>

    <!-- 우측: 스펙 (컬러 / 사이즈 / 패딩·마진) -->
    <aside class="inspect" id="inspect"></aside>
  </div>

  <script src="archive.js"></script>
  <script src="components.js"></script>
</body>
</html>
